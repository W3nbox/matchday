name: Sync sports and esports schedules
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'
permissions:
  contents: write
concurrency:
  group: schedule-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node check.cjs && node --test scripts/sync.test.cjs && python scripts/test_calendars.py
      - name: Fetch schedules
        id: fetch
        continue-on-error: true
        run: node scripts/sync.cjs
      - name: Commit snapshot and sync status
        run: |
          if ! git diff --quiet -- data/schedule.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/schedule.json
            git commit -m 'data: refresh sports and esports schedules'
            git push
          fi
      - name: Report unsuccessful fetch
        if: steps.fetch.outcome == 'failure'
        run: exit 1
