name: Deploy MATCHDAY to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ['Sync sports and esports schedules']
    branches: [main]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - name: Collect site files
        run: |
          mkdir -p _site/data
          cp *.html app.js styles.css favicon.svg _site/
          cp -r assets _site/
          cp data/schedule.json _site/data/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
